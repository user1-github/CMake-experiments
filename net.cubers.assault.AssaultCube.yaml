id: net.cubers.assault.AssaultCube
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: assaultcube
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.assaultcube
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: assaultcube
    buildsystem: cmake-ninja
    no-make-install: true
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CXX: clang++
        CXXFLAGS: ''
    make-args:
      - -v
    subdir: source
    sources:
      - type: git
        url: https://github.com/assaultcube/AC.git
        tag: v1.3.0.2
        commit: 1ece5af7533983bb8f827616381d282470793d90
      - type: file
        path: assault_cube.sh
      - type: file
        path: CMakeLists.txt
      - type: file
        path: net.cubers.assault.AssaultCube.png
      - type: file
        path: net.cubers.assault.AssaultCube.desktop
      - type: patch
        path: remove-enet_crc32_inc.patch
      - type: shell
        commands:
          - cp CMakeLists.txt -t source
          - sed -i 's|//#define PRODUCTION|#define PRODUCTION|' 'source/src/cube.h'
    post-install:
      - mkdir -p /app/share/assaultcube
      - cp -a ../bot ../config ../mods ../packages /app/share/assaultcube
      - install -Dm755 ac_client -t /app/bin
      - install -Dm755 ../assault_cube.sh /app/bin/assaultcube
      - install -Dm644 ../net.cubers.assault.AssaultCube.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 ../net.cubers.assault.AssaultCube.desktop -t /app/share/applications
