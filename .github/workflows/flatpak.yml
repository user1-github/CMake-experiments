on:
  push:
    branches: [redeclipse]
  pull_request:
name: CI
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        repository: flathub/shared-modules
        path: shared-modules
    - uses: actions/checkout@v7
      with:
        repository: user1-github/common-modules
        path: common-modules
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: redeclipse.flatpak
        manifest-path: net.redeclipse.RedEclipse.yaml
        cache-key: flatpak-builder-${{ github.sha }}
