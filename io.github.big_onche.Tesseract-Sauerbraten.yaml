id: io.github.big_onche.Tesseract-Sauerbraten
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: sauerract
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/licenses
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: sauerract
    buildsystem: cmake-ninja
    no-make-install: true
    build-options:
      env:
        CXXFLAGS: ''
    make-args:
      - -v
    subdir: src
    sources:
      - type: git
        url: https://github.com/Big-Onche/Tesseract-Sauerbraten.git
        commit: 21897d86ad848cf25fb9ab3d6e203a28618f96b4
      - type: file
        path: sauerract.sh
      - type: file
        path: CMakeLists.txt
      - type: file
        path: FastNoiseLite.h
      - type: file
        path: io.github.big_onche.Tesseract-Sauerbraten.png
      - type: file
        path: io.github.big_onche.Tesseract-Sauerbraten.desktop
      - type: patch
        path: gcc16.patch
      - type: shell
        commands:
          - cp CMakeLists.txt src
          - cp FastNoiseLite.h src/engine
    post-install:
      - mkdir -p /app/share/sauerract
      - cp -a ../config ../packages /app/share/sauerract
      - install -Dm755 client -t /app/bin
      - install -Dm755 ../sauerract.sh /app/bin/sauerract
      - install -Dm644 ../io.github.big_onche.Tesseract-Sauerbraten.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 ../io.github.big_onche.Tesseract-Sauerbraten.desktop -t /app/share/applications
