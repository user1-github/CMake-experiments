id: net.redeclipse.RedEclipse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: redeclipse
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-run/pipewire-0:ro
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/licenses
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: Mbed-TLS
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DUSE_SHARED_MBEDTLS_LIBRARY=ON
      - -DUSE_STATIC_MBEDTLS_LIBRARY=OFF
      - -DENABLE_TESTING=OFF
      - -DENABLE_PROGRAMS=OFF
    sources:
      - type: archive
        url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
        sha256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
      - type: patch
        path: patches/mbedtls_1.patch
      - type: patch
        path: patches/mbedtls_2.patch

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: redeclipse
    buildsystem: cmake-ninja
    no-make-install: true
    make-args:
      - -v
    subdir: src
    sources:
      - type: git
        url: https://github.com/redeclipse/base.git
        commit: 11bb34d9184687fbbea8bdc3ebf607186bbbaed8
      - type: file
        path: redeclipse.sh
      - type: file
        path: CMakeLists.txt
      - type: patch
        path: patches/xdg_data_home.patch
      - type: shell
        commands:
          - rm src/CMakeLists.txt
          - cp CMakeLists.txt src
    post-install:
      - install -Dm755 ../redeclipse.sh /app/bin/redeclipse
      - install -Dm755 client -t /app/share/redeclipse
      - cp -a ../config ../data /app/share/redeclipse
      - install -Dm644 ../src/install/nix/redeclipse_x256.png /app/share/icons/hicolor/256x256/apps/net.redeclipse.RedEclipse.png
      - install -Dm644 ../src/install/nix/redeclipse.desktop.am /app/share/applications/net.redeclipse.RedEclipse.desktop
      - desktop-file-edit --set-icon=net.redeclipse.RedEclipse --set-key=Exec --set-value=redeclipse /app/share/applications/net.redeclipse.RedEclipse.desktop
