id: io.github.big_onche.Tesseract-Continued
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: tesseract
finish-args:
  - --device=dri
  - --share=network
  - --socket=wayland
  - --filesystem=xdg-run/pipewire-0:ro
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_mixer.json
  - common-modules/enet/enet.yaml

  - name: tesseract
    buildsystem: cmake-ninja
    no-make-install: true
    make-args:
      - -v
    subdir: src
    sources:
      - type: git
        url: https://github.com/Big-Onche/Tesseract-Continued.git
        commit: 2b50e974b921e74ba812231d342d933e07c88575
      - type: file
        path: tesseract.sh
      - type: file
        path: CMakeLists.txt
      - type: file
        path: io.github.big_onche.Tesseract-Continued.desktop
      - type: patch
        path: gcc16.patch
      - type: shell
        commands:
          - cp CMakeLists.txt src
    post-install:
      - mkdir -p /app/share/tesseract
      - cp -a ../config ../media /app/share/tesseract
      - install -Dm755 client -t /app/bin
      - install -Dm755 ../tesseract.sh /app/bin/tesseract
      - install -Dm644 ../media/interface/cube.png /app/share/icons/hicolor/256x256/apps/io.github.big_onche.Tesseract-Continued.png
      - install -Dm644 ../io.github.big_onche.Tesseract-Continued.desktop -t /app/share/applications
