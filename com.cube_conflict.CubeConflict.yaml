id: com.cube_conflict.CubeConflict
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: cubeconflict
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: cube-conflict
    buildsystem: cmake-ninja
    no-make-install: true
    build-options:
      env:
        CXXFLAGS: ''
    make-args:
      - -v
    subdir: src
    sources:
      - type: git
        url: https://github.com/Big-Onche/Cube-Conflict.git
        commit: bcf94c7bb5f15e5f52dac2c021ebc32fe81400d3
      - type: file
        path: cube_conflict.sh
      - type: file
        path: CMakeLists.txt
      - type: file
        path: com.cube_conflict.CubeConflict.desktop
      - type: patch
        path: gcc16.patch
      - type: shell
        commands:
          - cp CMakeLists.txt -t src
    post-install:
      - install -Dm755 ../cube_conflict.sh /app/bin/cubeconflict
      - install -Dm755 ../run.sh /app/share/cubeconflict/run
      - install -Dm755 cc_client -t /app/share/cubeconflict/bins
      - cp -a ../config ../media /app/share/cubeconflict
      - install -Dm644 ../media/interface/cclogo.png /app/share/icons/hicolor/128x128/apps/com.cube_conflict.CubeConflict.png
      - install -Dm644 ../com.cube_conflict.CubeConflict.desktop -t /app/share/applications
