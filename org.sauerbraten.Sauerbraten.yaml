id: org.sauerbraten.Sauerbraten
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: sauerbraten
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.sauerbraten
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: SDL2_mixer
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2MIXER_MOD=OFF
      - -DSDL2MIXER_MIDI=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.2/SDL2_mixer-2.8.2.tar.gz
        sha256: 938dff531d00ace2296557a6599abe6f34599e2f34f0a4a08a397e2ccac8b8f7

  - name: sauerbraten
    buildsystem: cmake-ninja
    no-make-install: true
    build-options:
      env:
        CXXFLAGS: ''
    make-args:
      - -v
    subdir: src
    sources:
      - type: archive
        url: https://sourceforge.net/projects/sauerbraten/files/sauerbraten/2020_11_29/sauerbraten_2020_12_29_linux.tar.bz2
        sha256: cdba7c4a47cefd30d0afdd6a912199a1384319cf1619923cb7189e72e468be70
      - type: file
        path: sauerbraten.sh
      - type: file
        path: CMakeLists.txt
      - type: file
        path: org.sauerbraten.Sauerbraten.desktop
      - type: patch
        path: gcc16.patch
      - type: shell
        commands:
          - cp CMakeLists.txt -t src
    post-install:
      - mkdir -p /app/share/sauerbraten
      - cp -a ../data ../packages /app/share/sauerbraten
      - install -Dm755 sauerbraten_client -t /app/bin
      - install -Dm755 ../sauerbraten.sh /app/bin/sauerbraten
      - install -Dm644 ../data/cube.png /app/share/icons/hicolor/256x256/apps/org.sauerbraten.Sauerbraten.png
      - install -Dm644 ../org.sauerbraten.Sauerbraten.desktop -t /app/share/applications
